<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYU Ryde prototype</title>
<style>
:root{--bg:#ffffff;--map:#f3f5f7;--street:#ffffff;--ink:#141414;--mute:#626b75;--card:#ffffff;--line:#e3e7eb;--navy:#002e5d;--blue:#0047ba;--ok:#2f7d32;--mid:#b36b00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "IBM Plex Sans","Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.mapwrap{position:relative;flex:0 0 calc(44% - 10px);background:var(--map)}
.mapwrap.tall{flex-basis:calc(58% - 10px)}
.mapwrap.short{flex-basis:calc(32% - 10px)}
svg#map{width:100%;height:100%;display:block}
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;z-index:2}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:0 2px 10px #0003;height:46px}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);height:100%;min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--blue)}
.fab{width:46px;height:46px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px #0003;font-size:20px}
.sheet{flex:1;min-height:0;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;margin-top:-16px;position:relative;z-index:1;padding:14px 0 24px;box-shadow:0 -4px 14px #0002}
.pad{padding:0 16px}
h1{font-size:19px;margin:0 0 2px;font-weight:700}
h2{font-size:14px;margin:18px 0 8px;font-weight:700;color:var(--mute)}
.sub{color:var(--mute);font-size:13px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:10px 16px 6px;scroll-snap-type:x proximity}
.rc{flex:0 0 228px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;border-left:6px solid var(--c)}
.rc .n{font-weight:700;font-size:16px}
.rc .d{color:var(--mute);font-size:13px;margin-bottom:8px}
.rc .t{display:flex;align-items:baseline;gap:8px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.more{margin-top:8px;font-size:13px;color:var(--navy);background:none;border:0;padding:4px 0;font-weight:600}
.later{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}
.later.open{display:flex}
.later span{background:var(--bg);border-radius:8px;padding:3px 8px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--k)}
.err{margin:12px 16px;padding:12px;border-radius:12px;background:#c8372d1f;border:1px solid var(--bad);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--k)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:10px}
.stops{list-style:none;margin:0;padding:0}
.stops li{display:flex;gap:12px;padding:7px 0;position:relative}
.stops li:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--c);flex:none;margin-top:3px;z-index:1}
.stops li:not(:last-child):after{content:"";position:absolute;left:5px;top:20px;bottom:-9px;width:2px;background:var(--c)}
.stops .tm{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute)}
.alt{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:8px;text-align:left}
.cta{width:100%;border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:6px;padding:14px;margin-top:14px;font-size:16px}
.ghost{width:100%;background:none;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;font-weight:600}
.notice{display:flex;gap:10px;background:#c98a001f;border:1px solid var(--mid);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.back{position:absolute;left:12px;top:12px;z-index:2;width:46px;height:46px;border-radius:14px;border:0;background:var(--card);box-shadow:0 2px 10px #0003;font-size:20px}
.hide{display:none!important}
.eta{display:flex;align-items:baseline;gap:8px}
.pulse{animation:p 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

.byuhead{height:54px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px;flex:none}
.byumark{font-size:21px;font-weight:800;letter-spacing:.5px;padding-right:12px;border-right:1px solid rgba(255,255,255,.3)}
.rydetitle{font-size:16px;font-weight:650}

body,#app{background:#fff}
.sheet{background:#fff;box-shadow:0 -3px 12px rgba(0,46,93,.08)}
.mapwrap{background:#f3f5f7}
.rc,.card,.alt,.search,.fab,.back{background:#fff}
.rc,.card,.alt{box-shadow:0 1px 3px rgba(0,46,93,.05)}
.later span{background:#f5f7f9}


.mapwrap{overflow:hidden;touch-action:none}
svg#map{touch-action:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
.mapcontrols{position:absolute;right:12px;top:70px;z-index:3;display:grid;gap:6px}
.mapcontrols button{width:42px;height:42px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;font-size:21px;font-weight:700;box-shadow:0 1px 5px #0002}
.sheet{transition:flex-basis .22s ease,border-radius .22s ease}
.sheetHandle{position:sticky;top:0;z-index:5;background:#fff;padding:7px 0 5px;display:flex;justify-content:center;touch-action:none;cursor:ns-resize}
.sheetHandle:before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:#c6ccd2}
.sheet.expanded{flex:1 1 auto;min-height:0;border-radius:14px 14px 0 0;box-shadow:0 -3px 12px rgba(0,46,93,.08)}
.sheet.expanded .sheetHandle{border-radius:14px 14px 0 0}
.mapwrap.sheet-open{flex-basis:92px!important;min-height:92px}
.mapwrap.sheet-open svg,.mapwrap.sheet-open .mapcontrols,.mapwrap.sheet-open .top{opacity:0;pointer-events:none}
.mapwrap.sheet-open .back{opacity:1}

.profileBtn{margin-left:auto;border:1px solid #ffffff55;background:transparent;color:#fff;width:40px;height:40px;border-radius:8px;font-size:18px}
.modalBack{position:absolute;inset:54px 0 0;background:#00183255;z-index:30;display:flex;align-items:flex-end}.modal{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px 16px 26px}.field{display:block;margin-top:12px;font-size:13px;font-weight:650}.field input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}.favbtn{width:100%;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;border-radius:6px;padding:12px;margin-top:8px;font-size:15px}.favbtn.on{background:#eef4ff}.status{font-size:13px;margin-top:10px;color:var(--mute)}

/* ===== DESKTOP PRESENTATION MODE ===== */
@media (min-width: 800px){
  html,body{height:100%;min-height:100%;overflow:hidden}
  body{display:block;background:#f3f5f7}
  #app{max-width:none;width:100vw;height:100vh;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(380px,.85fr);grid-template-rows:64px minmax(0,1fr);overflow:hidden;background:#fff}
  .byuhead{grid-column:1 / -1;grid-row:1;height:64px;padding:0 28px;box-shadow:0 1px 0 var(--line);z-index:20}
  .byumark{font-size:24px}.rydetitle{font-size:18px}
  .profileBtn{width:42px;height:42px}
  .mapwrap,.mapwrap.tall,.mapwrap.short,.mapwrap.sheet-open{grid-column:1;grid-row:2;position:relative;flex:none!important;min-height:0!important;height:100%;margin:0;background:var(--map)}
  .mapwrap.sheet-open svg,.mapwrap.sheet-open .mapcontrols,.mapwrap.sheet-open .top{opacity:1;pointer-events:auto}
  .sheet,.sheet.expanded{grid-column:2;grid-row:2;position:relative;z-index:5;margin:0;border-radius:0;min-height:0;height:100%;overflow-y:auto;padding:26px 0 40px;border-left:1px solid var(--line);box-shadow:-4px 0 14px rgba(0,46,93,.06);background:#fff}
  .sheetHandle{display:none!important}
  .pad{padding:0 28px}
  .rail{display:grid;grid-template-columns:1fr;gap:10px;overflow:visible;padding:12px 28px 8px}
  .rc{width:100%;flex:none}
  .top{left:24px;right:24px;top:22px;max-width:650px}
  .search{height:50px;border-radius:8px}.fab{height:50px;width:50px;border-radius:8px}
  .mapcontrols{right:24px;top:24px}
  .back{left:24px;top:22px;border-radius:8px}
  h1{font-size:24px}.big{font-size:30px}
  .modalBack{position:fixed;inset:64px 0 0;align-items:center;justify-content:center;padding:30px}
  .modal{width:min(520px,calc(100vw - 60px));border-radius:12px;padding:26px;box-shadow:0 14px 45px #0004}
}


/* Accurate reference map and compact route dashboard */
.mapwrap{background:#e9edf0}
svg#map{max-width:100%;max-height:100%;object-fit:contain}
.rc{padding:12px 14px;border-left-width:5px;min-width:0}
.route-open{appearance:none;background:transparent;border:0;text-align:left;display:flex;flex-direction:column;align-items:flex-start;width:100%;gap:3px;padding:0}
.route-name{font-size:17px;font-weight:750;color:var(--navy)}
.route-stop{font-size:12px;color:var(--mute);line-height:1.3}
.next-time{font-size:23px;font-weight:750;letter-spacing:-.5px;line-height:1.2;margin-top:8px;color:#172d45}
.route-note{font-size:11px;color:var(--mute)}
.more{margin-top:8px;border-top:1px solid var(--line);width:100%;text-align:left;padding-top:9px}
.map-note{border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:12px;color:var(--mute)}
.map-note b{font-size:13px;color:var(--navy)}
@media(min-width:800px){
  #app{grid-template-columns:minmax(0,1.04fr) minmax(430px,.96fr)}
  .mapwrap{display:flex;align-items:center;justify-content:center;padding:18px}
  svg#map{width:100%;height:100%;max-height:min(79vh,760px);border-radius:8px;box-shadow:0 2px 14px #0001;background:#fff}
  .sheet,.sheet.expanded{padding:22px 0 32px}
  .rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 24px}
  .pad{padding-left:24px;padding-right:24px}
  .rc{width:auto}
  .mapcontrols{top:16px;right:16px}
}
@media(max-width:799px){.mapwrap{flex-basis:43%;min-height:200px}.rail{gap:10px}.rc{flex-basis:215px}.mapcontrols{top:65px}}


/* V3: map as an interactive reference, not a full-screen blown-up photograph */
@media(min-width:800px){
 #app{grid-template-columns:minmax(420px, .9fr) minmax(540px,1.1fr)}
 .mapwrap{padding:86px 22px 110px;align-items:center;justify-content:center;background:#f0f3f6}
 svg#map{width:min(100%,650px);height:auto;aspect-ratio:840/810;max-height:calc(100vh - 290px);background:#fff;box-shadow:0 8px 30px #002e5d15;border:1px solid #d9e1e8}
 .top{top:16px;left:22px;right:90px;max-width:none}
 .mapcontrols{top:16px;right:22px}
}
.map-caption{position:absolute;left:22px;top:81px;z-index:2;color:#002e5d;font-weight:750;font-size:14px}
.map-caption span{display:block;color:#617185;font-size:11px;font-weight:400;margin-top:3px}
.map-route-picker{position:absolute;bottom:14px;left:18px;right:18px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:3}
.map-route-picker button{font:inherit;font-size:11px;font-weight:700;border:1px solid #dbe2ea;border-left:4px solid var(--route);background:#fff;color:#173451;border-radius:6px;padding:7px 9px;cursor:pointer;box-shadow:0 1px 4px #0001}
.map-route-picker button:hover,.map-route-picker button:focus-visible{background:#eaf2ff;outline:2px solid #8ab4e3}
.stop-departures{display:flex;flex-direction:column;gap:3px;font-size:11px;padding:6px 0;border-bottom:1px solid #e8edf2}
.stop-departures strong{color:#173451}
.stop-departures span{background:none!important;color:#526779}
.rc .later.open{display:block}
@media(max-width:799px){
 .map-caption{top:68px;font-size:12px}
 .map-route-picker{bottom:5px;gap:3px}
 .map-route-picker button{font-size:9px;padding:4px 5px}
 svg#map{max-height:calc(100% - 100px)}
}

/* Full-bleed map: no boxed image or artificial small maximum size */
@media(min-width:800px){
 #app{grid-template-columns:minmax(0,1.08fr) minmax(500px,.92fr)}
 .mapwrap,.mapwrap.tall,.mapwrap.short,.mapwrap.sheet-open{padding:0!important;background:#fff!important;display:flex;align-items:center;justify-content:center}
 svg#map{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important}
 .map-caption{top:82px;left:20px;background:#fffffff0;padding:7px 10px;border-radius:6px}
 .map-route-picker{bottom:12px;left:12px;right:12px}
}
@media(max-width:799px){
 .mapwrap{padding:0!important;background:#fff!important}
 svg#map{width:100%!important;height:100%!important;max-height:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}
}

/* Integrated map: full network fits the available canvas, controls stay outside it. */
#app{max-width:none;width:100%;height:100dvh}
.mapwrap,.mapwrap.tall,.mapwrap.short{position:relative;min-height:320px;overflow:hidden}
svg#map{position:absolute!important;left:0;top:84px;width:100%!important;height:calc(100% - 148px)!important;max-width:none!important;max-height:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;background:white}
.map-caption{display:none}.top{top:16px;left:16px;right:76px}.mapcontrols{top:16px;right:16px;display:flex;flex-direction:column}.mapcontrols button{width:38px;height:38px}.map-route-picker{bottom:12px;left:12px;right:12px}.map-route-picker button.selected{background:#eaf2ff;outline:2px solid #002e5d}
.back{top:16px;left:16px}.sheet{margin-top:0}.mapwrap.sheet-open{min-height:320px;flex-basis:55%!important}.mapwrap.sheet-open svg,.mapwrap.sheet-open .mapcontrols,.mapwrap.sheet-open .top{opacity:1;pointer-events:auto}
@media(min-width:800px){#app{grid-template-columns:minmax(0,1fr) minmax(360px,420px)}.mapwrap,.mapwrap.tall,.mapwrap.short,.mapwrap.sheet-open{padding:0!important;min-height:0!important;height:100%;background:white!important}.rail{grid-template-columns:1fr}.top{max-width:600px}.sheet,.sheet.expanded{padding-top:22px}}
@media(max-width:799px){.mapwrap,.mapwrap.tall,.mapwrap.short{flex:0 0 60%!important;min-height:300px}.sheet{flex:1;min-height:0}.map-route-picker{gap:4px;bottom:8px}.map-route-picker button{font-size:10px;padding:5px 7px}svg#map{top:76px;height:calc(100% - 142px)!important}.mapwrap.sheet-open{flex-basis:42%!important}.sheet.expanded{flex:1}}
</style>
</head>
<body>
<div id="app">
  <header class="byuhead"><span class="byumark">BYU</span><span class="rydetitle">The Ryde</span><button id="profileBtn" class="profileBtn" aria-label="Profile">👤</button></header>
  <div class="mapwrap" id="mapwrap"><div class="map-caption">BYU Ryde route map <span>Drag to pan · Scroll to zoom · Select a route below</span></div>
    <svg id="map" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interactive map of Ryde shuttle routes"></svg>
    <div class="mapcontrols" aria-label="Map controls">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="fitMap" aria-label="Show entire route network">⌖</button>
    </div>
    <div class="top" id="top">
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search route, stop or destination" aria-label="Search routes"></label>
      <button class="fab" id="locate" aria-label="Show entire map">◎</button>
    </div>
    <div class="map-route-picker" id="mapRoutePicker" aria-label="Select a route on the map"></div>
    <button class="back hide" id="back" aria-label="Back">←</button>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="modalBack hide" id="profileModal"><section class="modal"><div id="profileContent"></div><button class="ghost" id="closeProfile">Close</button></section></div>
</div>

const fmtDeparture=t=>{const [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
function provoNow(){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=k=>parts.find(x=>x.type===k)?.value;
 return {day:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[get('weekday')],minutes:Number(get('hour'))*60+Number(get('minute'))};
}
function nextDepartures(r,j=0,n=4){
 const {day,minutes}=provoNow();
 return r.timetable[j].filter(t=>{
  if(r.service!=='daily'&&(day===0||day===6))return false;
  if(day===5&&t.days==='Mon-Thu')return false;
  const [h,m]=t.time.split(':').map(Number);
  return h*60+m>=minutes;
 }).slice(0,n);
}

    gBus.style.opacity=feed?1:.35;
    const bp=r.path.getPointAtLength(busD);
    gBus.setAttribute("transform",`translate(${bp.x},${bp.y})`);
    gUser.setAttribute("transform",`translate(${uX},${uY})`);
    const minX=Math.min(uX,bp.x)-55,maxX=Math.max(uX,bp.x)+55,minY=Math.min(uY,bp.y)-55,maxY=Math.max(uY,bp.y)+55;
    const w=Math.max(170,maxX-minX,(maxY-minY)/1.3);
    // Keep the accurate reference map framed; no fabricated live position zoom.
    view(0,0,840);
  };
  sheet.innerHTML=`<div class="pad" style="--c:${r.color}">
   <div class="row" style="border:0;padding:0"><div><h1>${r.name} is on the way</h1><div class="sub">to ${r.dest}</div></div></div>
   <div class="card"><div class="sub">Arriving at your stop</div><div class="eta"><span class="big" id="eta"></span></div><div class="sub" id="etasub"></div></div>
   <div id="lostmsg" class="notice hide" role="status"><span aria-hidden="true">⚠️</span><span>Live bus information is currently unavailable. Showing scheduled times only; next scheduled arrival is ${clock(r.dep[0])}.</span></div>
   ${r.live?crowdHTML(r):""}
   <button class="ghost" id="sim">Simulate lost signal</button>
   <button class="ghost" id="end">End trip</button></div>`;addSheetHandle();
  $("sim").onclick=()=>{lostSignal=!lostSignal;$("sim").textContent=lostSignal?"Restore signal":"Simulate lost signal";upd()};
  $("end").onclick=()=>{lostSignal=false;home()};
  upd();
  timer=setInterval(()=>{
    if(!(r.live&&!lostSignal))return;
    if(busD<boardD)busD=Math.min(boardD,busD+boardD/120);
    const tx=board[0]&&board.pt.x-10,ty=board.pt.y+10;
    uX+=(tx-uX)*.04;uY+=(ty-uY)*.04;upd();
  },250);
}

/* ---- events ---- */
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){detail(o.dataset.open);sheet.scrollTop=0;return}
  const m=e.target.closest("[data-more]");if(m){const l=$("l"+m.dataset.more);const op=l.classList.toggle("open");m.setAttribute("aria-expanded",op);m.textContent=op?"Next departures ▴":"Next departures ▾"}
});
$("back").onclick=()=>screen==3?detail(sel.id):home(q.value);
sheet.addEventListener("click",e=>{if(e.target.id=="go")live()});
q.addEventListener("input",()=>home(q.value));
$("locate").onclick=()=>{view(0,0,840)};

/* ---- interactive map pan / zoom ---- */
let vb={x:0,y:0,w:840,h:810}, mapDrag=false,moved=false,mx=0,my=0,startVB=null;
const applyVB=()=>svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const syncVB=()=>{const a=svg.getAttribute("viewBox").split(/\s+/).map(Number);vb={x:a[0],y:a[1],w:a[2],h:a[3]}};
const zoom=f=>{
 syncVB();const nw=Math.max(320,Math.min(1250,vb.w*f)),nh=nw*vb.h/vb.w;
 vb.x+= (vb.w-nw)/2;vb.y+=(vb.h-nh)/2;vb.w=nw;vb.h=nh;applyVB();
};
$("zoomIn").onclick=()=>zoom(.78);
$("zoomOut").onclick=()=>zoom(1.28);
$("fitMap").onclick=()=>{if(sel)fit(sel);else view(0,0,840);syncVB()};
svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY>0?1.12:.89)},{passive:false});
svg.addEventListener("pointerdown",e=>{
 if(e.target.closest("circle,path"))return;
 moved=false;mapDrag=true;svg.classList.add("dragging");svg.setPointerCapture?.(e.pointerId);
 mx=e.clientX;my=e.clientY;syncVB();startVB={...vb};
});
svg.addEventListener("pointermove",e=>{
 if(!mapDrag)return;
 if(Math.hypot(e.clientX-mx,e.clientY-my)>5)moved=true;
 const r=svg.getBoundingClientRect();
 vb.x=startVB.x-(e.clientX-mx)*startVB.w/r.width;
 vb.y=startVB.y-(e.clientY-my)*startVB.h/r.height;
 applyVB();
});
const endMapDrag=e=>{mapDrag=false;svg.classList.remove("dragging");try{svg.releasePointerCapture?.(e.pointerId)}catch{}};
svg.addEventListener("pointerup",endMapDrag);svg.addEventListener("pointercancel",endMapDrag);

/* ---- pull-up shuttle sheet ---- */
let sheetDrag=false,sy=0;
sheet.addEventListener("pointerdown",e=>{
 if(!e.target.closest(".sheetHandle"))return;
 sheetDrag=true;sy=e.clientY;sheet.setPointerCapture?.(e.pointerId);
});
sheet.addEventListener("pointerup",e=>{
 if(!sheetDrag)return;sheetDrag=false;
 const dy=e.clientY-sy;
 if(Math.abs(dy)<18)setSheetExpanded(!sheet.classList.contains("expanded"));
 else setSheetExpanded(dy<0);
});
sheet.addEventListener("pointercancel",()=>sheetDrag=false);
sheet.addEventListener("keydown",e=>{
 if(!e.target.closest(".sheetHandle"))return;
 if(e.key==="Enter"||e.key===" "){e.preventDefault();setSheetExpanded(!sheet.classList.contains("expanded"))}
});


$("profileBtn").onclick=openProfile;$("closeProfile").onclick=()=>$("profileModal").classList.add("hide");
$("profileModal").addEventListener("click",e=>{if(e.target.id==="profileModal")$("profileModal").classList.add("hide");if(e.target.id==="switchUser"){currentUser=null;favoriteRouteIds.clear();localStorage.removeItem("ryde_net_id");openProfile()}});
$("profileContent").addEventListener("submit",async e=>{if(e.target.id!=="profileForm")return;e.preventDefault();const f=new FormData(e.target),st=$("profileStatus");st.textContent="Saving…";try{await saveUser(f.get("name"),f.get("net_id"),f.get("email"));openProfile()}catch(err){st.textContent=err.message||"Could not save profile."}});
sheet.addEventListener("click",async e=>{if(e.target.id!=="favoriteBtn")return;if(!currentUser){openProfile();return}e.target.disabled=true;try{await toggleFavorite(sel.id);e.target.classList.toggle("on",favoriteRouteIds.has(String(sel.id)));e.target.textContent=favoriteRouteIds.has(String(sel.id))?"★ Favorite route":"☆ Add to favorites"}catch(err){alert(err.message||"Could not save favorite.")}finally{e.target.disabled=false}});

async function start(){buildMap();home();try{await loadSavedUser()}catch(e){console.warn("Profile unavailable",e)}} start();
new ResizeObserver(()=>fit()).observe(svg);
</script>
</body>
</html>
